schema_version: 1
tool_version: v1.0.13
tool_checksums_sha256: 164e5c8abefe655958f522677856816faddbd2a8d40eba7d37ba5a031210df70

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt

operations:
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: conformance
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzRequestSpecURL$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzHeaderValidation$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzAuthenticationInputs$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzAuthenticationChallengeHeaders$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzErrorPayloadClassification$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzRedirectCredentialBoundary$'
        budget: 10000x
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzRetryPolicy$'
        budget: 10000x
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
